name: Deploy docs site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "!docs/standings-proxy/**"
      - ".github/workflows/deploy-docs.yml"
  # Allows a manual redeploy from the Actions tab.
  workflow_dispatch:

# GITHUB_TOKEN needs to read the repo and mint a Pages deployment via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue the newer one but let an in-flight
# deployment finish rather than leaving Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # The site is a project page at https://<owner>.github.io/<repo>, so
      # everything has to be prefixed with /<repo>. next.config.ts and
      # lib/site.ts read these; both are inlined into the client bundle.
      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Unset until standings-proxy/ has been deployed once (see its
          # README) — the Olympiad lobby degrades to a chess-results.com
          # link when this is empty, so leaving it unset never breaks the
          # build or the page.
          NEXT_PUBLIC_STANDINGS_PROXY_URL: ${{ vars.STANDINGS_PROXY_URL }}
        run: npm run build

      # Belt and braces: the Actions deploy path doesn't run Jekyll, but if it
      # ever did it would strip the underscore-prefixed `_next/` directory.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
